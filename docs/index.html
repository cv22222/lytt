<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#191e30"><title>夜航手记</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;color:#eee6da;background:radial-gradient(ellipse at 80% 12%,#504454 0,transparent 38%),linear-gradient(155deg,#202838,#171a29 68%);min-height:100vh;font:16px/1.75 system-ui,"Microsoft YaHei",sans-serif}main,header{width:min(890px,91%);margin:auto}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #585460;padding:16px 0;color:#d8c2ab}h1,h2,h3,summary{font-family:"Songti SC","SimSun",Georgia,serif;font-weight:500}h1{font-size:clamp(38px,7vw,66px);margin:0;letter-spacing:.09em}h2{font-size:30px;margin:12px 0}h3{margin:8px 0;font-size:24px}.gate{max-width:520px;margin:9vh auto}.moon{width:58px;height:58px;border-radius:50%;box-shadow:inset -13px -4px #efcf99;transform:rotate(-18deg);margin-bottom:18px}.sub,small,time{color:#c0b6bc}section{padding:18px 0}button,.file{cursor:pointer;border:1px solid #736673;color:#f4e8d6;background:#2b2c3b;border-radius:8px;padding:8px 14px;font:inherit}button.primary,button[aria-current=true]{background:#edd1ac;color:#352e33;border-color:#edd1ac}input,select,textarea{font:inherit;border:1px solid #726778;background:#202331;color:#f4ebe0;border-radius:6px;padding:9px 12px;width:100%}input[type=checkbox]{width:auto}textarea{min-height:118px;resize:vertical}label{display:block;margin:10px 0}nav,.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}nav{padding-bottom:18px;border-bottom:1px solid #514e5c}article,details.card{padding:16px 0;border-bottom:1px solid #514e5c}.body{white-space:pre-wrap;overflow-wrap:anywhere}.photo{max-width:min(100%,550px);max-height:420px;border-radius:8px;display:block;margin:12px 0}dialog{background:#272939;color:inherit;border:1px solid #716678;width:min(520px,90%)}[hidden]{display:none!important}#msg{color:#ffe0b1}input:focus,textarea:focus,button:focus-visible{outline:2px solid #f2d1a2}main{padding-bottom:70px}
.gate{position:relative;padding:40px clamp(20px,5vw,48px);border:1px solid #72616d;border-radius:14px;background:linear-gradient(155deg,#393748cc,#232839dd);box-shadow:0 30px 90px #11152288}.gate:before{content:"";position:absolute;right:9%;top:14%;width:110px;height:75px;pointer-events:none;background:radial-gradient(circle at 80% 8%,#dcb78d 1px,transparent 2px),radial-gradient(circle at 30% 42%,#e8d8ba 1px,transparent 2px),radial-gradient(circle at 62% 62%,#d8c8bb 1px,transparent 2px)}.gate form{margin-top:30px}.gate .primary{margin-top:8px}#writing article{border-left:2px solid #7a6a73;padding-left:18px;margin:16px 0}article button{margin:8px 8px 0 0;font-size:14px}</style></head><body><header><span>☾　夜航手记</span><button id="lock" hidden>锁上手记</button></header><main>
<section id="gate" class="gate"><div class="moon" aria-hidden="true"></div><h1>夜航手记</h1><p class="sub">有些话想了很久，今晚先写在这里。</p><form id="unlock"><label>我的手机号是什么？<input id="pass" type="password" inputmode="numeric" required autocomplete="off" placeholder="输入约定的答案"></label><button class="primary">打开手记</button></form></section>
<p id="msg" role="status"></p><div id="inside" hidden><nav id="tabs" aria-label="手记菜单"></nav>
<section id="writing"><h2>此刻想记下</h2><form id="compose"><label>放在哪里<select id="kind"><option>关系里的思考</option><option>想和你分享的日常</option><option>未寄出的信</option></select></label><label>标题<input id="title" maxlength="180" placeholder="给这一刻起个名字（可留空）"></label><label>正文<textarea id="body" placeholder="今天发生了什么？或者，有哪句话一直停在心里？"></textarea></label><label>附一张照片<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="actions"><button class="primary">保存这一页</button><button type="button" id="cancel" hidden>取消编辑</button></div></form><h2>写过的页</h2><input id="findPage" type="search" aria-label="查找手记" placeholder="找一句写过的话…"><div id="pages"></div></section>
<section id="mood" hidden><h2>我的状态</h2><form id="stateForm"><label>日期<input type="date" id="day" required></label><label>想到这段关系时<select id="feeling"><option>还说不清</option><option>很难放下</option><option>有些松动</option><option>今天比较平静</option><option>觉得释然了</option></select></label><label>昨晚失眠了吗？<select id="sleep"><option>暂不记录</option><option>失眠了</option><option>睡得还好</option></select></label><label>今天喝酒了吗？<select id="drink"><option>暂不记录</option><option>喝了</option><option>没喝</option></select></label><button class="primary">保存这一天</button></form><div id="history"></div></section>
<section id="meaning" hidden><h2>知道 LYTT 是什么意思吗？</h2><label>这个网址缩写背后的故事<textarea id="story" placeholder="只有你知道它的来历。"></textarea></label><button id="saveStory">保存故事</button></section>
<section id="share" hidden><h2>挑几页给你</h2><p class="sub">短手记可勾选后复制加密分享链接。分享照片或长信时，下载加密文件，把文件和这个网址发给她。她打开网址、输入答案，再点「读收到的手记」选择文件。你的每日状态始终留在本机。</p><div id="choices"></div><button id="linkLetter">复制加密分享链接</button> <button id="export">下载选中的页</button><h2>读收到的手记</h2><label>打开加密手记文件<input id="receive" type="file" accept=".json,application/json"></label><div id="received"></div></section>
<details class="card"><summary>我的加密备份</summary><p>换设备前，把整本手记下载给自己。备份包含每日状态，请自己保管。</p><button id="backup">下载整本备份</button><label>从备份恢复（将替换当前内容）<input id="restore" type="file" accept=".json"></label></details><small>手记加密保存在当前浏览器。清除网站数据会清除本机手记。</small></div></main><script src="night.js" defer></script></body></html>
