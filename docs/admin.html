<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>间记 · 管理后台</title><link rel="stylesheet" href="style.css"><header><strong>管理后台</strong><a href="./">返回记录本 ↗</a></header><main><form id="login"><h2>站主登录</h2><label>管理密钥<input id="key" type="password" required autocomplete="current-password"></label><button class="primary">登录</button></form><p id="message" role="status"></p><section id="panel" hidden><div class="bar"><button id="new">新建记录</button><button id="logs">查看访问日志</button><button id="logout">退出</button></div><h2>站点设置</h2><form id="settings"><label>站名<input id="name" required maxlength="80"></label><label>简介<input id="intro" maxlength="400"></label><button>保存设置</button></form><h2>全部记录</h2><div id="entries"></div><form id="editor" hidden><h2>编辑记录</h2><label>标题<input id="title" required maxlength="200"></label><label>类型<select id="kind"><option>对话</option><option>状况</option></select></label><label>日期<input id="date" type="date" required></label><label>正文<textarea id="body" required maxlength="60000"></textarea></label><label>可见性<select id="published"><option value="0">草稿，仅后台可见</option><option value="1">发布到前台</option></select></label><button class="primary">保存记录</button></form><section id="visits" hidden><h2>最近访问</h2><p>最近 200 条，时间按当前设备时区显示。</p><div class="scroll"><table><thead><tr><th>时间</th><th>访问内容</th><th>IP</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main><script src="config.js"></script><script src="admin.js"></script></html>
