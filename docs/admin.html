<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>间记 · 管理后台</title><link rel="stylesheet" href="style.css"><header><strong>管理后台</strong><a href="./">返回记录本 ↗</a></header><main><h2>本地管理</h2><p>保存后可在这个浏览器里继续阅读。清除网站数据会移除本地修改，其他设备和访客各有自己的记录。</p><p id="message" role="status"></p><section id="panel" hidden><div class="bar"><button id="new">新建记录</button><button id="logs">查看本机阅读记录</button></div><h2>站点设置</h2><form id="settings"><label>站名<input id="name" required maxlength="80"></label><label>简介<input id="intro" maxlength="400"></label><button>保存设置</button></form><h2>全部记录</h2><div id="entries"></div><form id="editor" hidden><h2>编辑记录</h2><label>标题<input id="title" required maxlength="200"></label><label>类型<select id="kind"><option>对话</option><option>状况</option></select></label><label>日期<input id="date" type="date" required></label><label>正文<textarea id="body" required maxlength="60000"></textarea></label><label>可见性<select id="published"><option value="0">草稿，仅后台可见</option><option value="1">在本机首页显示</option></select></label><button class="primary">保存记录</button></form><section id="visits" hidden><h2>本机阅读记录</h2><p>最近 200 条，时间按当前设备时区显示。</p><div class="scroll"><table><thead><tr><th>时间</th><th>访问内容</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main><script src="config.js"></script><script src="admin.js"></script></html>
